<div id="hint">Scroll / pinch to zoom · drag to move · vector, stays sharp at any zoom</div>
<script>
const W=3268.5,H=1732.0,view=document.getElementById('view'),stage=document.getElementById('stage'),pct=document.getElementById('pct');
let s=1,x=0,y=0;const MIN=0.05,MAX=8;
function apply(){stage.style.transform=`translate(${x}px,${y}px) scale(${s})`;pct.textContent=Math.round(s*100)+'%';}
function zoomAt(f,px,py){const ns=Math.min(MAX,Math.max(MIN,s*f));x=px-(px-x)*(ns/s);y=py-(py-y)*(ns/s);s=ns;apply();}
function fit(){const vw=view.clientWidth,vh=view.clientHeight;s=Math.min(vw/W,vh/H)*0.98;x=(vw-W*s)/2;y=(vh-H*s)/2;apply();}
function center(){return[view.clientWidth/2,view.clientHeight/2];}
document.getElementById('in').onclick=()=>zoomAt(1.4,...center());
document.getElementById('out').onclick=()=>zoomAt(1/1.4,...center());
document.getElementById('fit').onclick=fit;
document.getElementById('one').onclick=()=>zoomAt(1/s,...center());
view.addEventListener('wheel',e=>{e.preventDefault();const r=view.getBoundingClientRect();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top);},{passive:false});
const P=new Map();let last=0;
view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);view.classList.add('drag');last=0;});
view.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const p=P.get(e.pointerId);
 if(P.size===1){x+=e.clientX-p[0];y+=e.clientY-p[1];P.set(e.pointerId,[e.clientX,e.clientY]);apply();}
 else{P.set(e.pointerId,[e.clientX,e.clientY]);const v=[...P.values()],d=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);
  if(last){const r=view.getBoundingClientRect();zoomAt(d/last,(v[0][0]+v[1][0])/2-r.left,(v[0][1]+v[1][1])/2-r.top);}last=d;}});
['pointerup','pointercancel'].forEach(t=>view.addEventListener(t,e=>{P.delete(e.pointerId);last=0;if(!P.size)view.classList.remove('drag');}));
addEventListener('resize',fit);fit();
setTimeout(()=>document.getElementById('hint').style.opacity=0,5000);
</script></body></html>
